<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="robots" content="noindex" />
  <title>MetaTrader — выбор версии</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    :root {
      --accent: #007AFF;
      --text: #000000;
      --text-2: #8E8E93;
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --sep: #E5E5E5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px max(24px, env(safe-area-inset-left)) 40px;
    }
    .wrap { width: 100%; max-width: 460px; }
    header { text-align: center; margin-bottom: 28px; }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 14px;
      display: block; object-fit: contain;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
    header p { margin-top: 6px; font-size: 15px; color: var(--text-2); }

    .cards { display: grid; gap: 14px; }
    .card {
      display: flex; align-items: center; gap: 16px;
      background: var(--card); border-radius: 18px;
      padding: 20px; text-decoration: none; color: inherit;
      border: 1.5px solid transparent;
      transition: transform .15s cubic-bezier(.32,.72,0,1), border-color .15s;
    }
    .card:active { transform: scale(.98); }
    .card.suggested { border-color: var(--accent); }
    .card .icon {
      flex: 0 0 48px; width: 48px; height: 48px; border-radius: 12px;
      background: rgba(0,122,255,0.10);
      display: flex; align-items: center; justify-content: center;
    }
    .card .icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
    .card .body { flex: 1; min-width: 0; }
    .card .title { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
    .card .sub { margin-top: 2px; font-size: 13px; color: var(--text-2); }
    .card .chev { flex: 0 0 auto; color: #C7C7CC; }

    .hint {
      margin-top: 16px; text-align: center; font-size: 13px; color: var(--text-2);
      min-height: 16px;
    }
    footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" alt="MetaTrader 5" src="mt5-logo.png" />
      <h1>MetaTrader</h1>
      <p>Выберите версию для вашего устройства</p>
    </header>

    <div class="cards">
      <a class="card" id="card-mobile" href="/mobile/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg>
        </span>
        <span class="body">
          <span class="title">Веб-версия для телефона</span>
          <span class="sub">Устанавливается на экран «Домой», работает как приложение</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5 7 7.5l-5.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </a>

      <a class="card" id="card-pc" href="/pc/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><line x1="9" y1="21" x2="15" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </span>
        <span class="body">
          <span class="title">Веб-версия для ПК</span>
          <span class="sub">Широкие таблицы, раскладка для десктопа</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5 7 7.5l-5.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </a>
    </div>

    <p class="hint" id="hint"></p>

    <footer>MetaTrader 5 — товарный знак MetaQuotes Ltd.</footer>
  </div>

  <script>
    // Автоопределение устройства — только подсказка, без принудительного редиректа.
    (function () {
      var isMobile = /Android|iPhone|iPad|iPod|Mobile|Opera Mini/i.test(navigator.userAgent)
        || (('ontouchstart' in window) && window.matchMedia('(max-width: 820px)').matches);
      var hint = document.getElementById('hint');
      if (isMobile) {
        document.getElementById('card-mobile').classList.add('suggested');
        hint.textContent = 'Похоже, вы открыли страницу с телефона';
      } else {
        document.getElementById('card-pc').classList.add('suggested');
        hint.textContent = 'Похоже, вы открыли страницу с компьютера';
      }
    })();
  </script>
</body>
</html>
