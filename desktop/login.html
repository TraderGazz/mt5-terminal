<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaTrader 5 — Вход</title>
<style>
  html,body{height:100%;margin:0;font-family:Tahoma,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:#1b2733}
  form{width:280px;background:#fff;border-radius:4px;padding:28px 24px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:20px}
  .brand .emblem{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;background:#2962ff;color:#fff;font-weight:bold;font-size:15px}
  .brand span.title{font-size:14px;color:#1c1c1e;font-weight:600}
  label{display:block;font-size:12px;color:#6b6b70;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #c8c8cc;border-radius:3px;font-size:14px}
  button{width:100%;margin-top:18px;padding:9px;border:none;border-radius:3px;background:#2962ff;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .error{margin-top:10px;font-size:12px;color:#d9342b;min-height:14px}
</style>
</head>
<body>
<form id="loginForm">
  <div class="brand"><span class="emblem">5</span><span class="title">MetaTrader 5 — Торговый терминал</span></div>
  <label for="login">Логин</label>
  <input id="login" name="login" autocomplete="username" required>
  <label for="password">Пароль</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div class="error" id="error"></div>
  <button id="submit" type="submit">Войти</button>
</form>
<script src="login.js"></script>
</body>
</html>
